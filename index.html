<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basement 37th Floor | 타로 & 심리 분석</title>
    <style>
        /* 기본 스타일 및 다크 테마 설정 */
        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background-color: #1a1a2e; /* 어두운 남색 배경 */
            color: #eaeaea; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
        }
        header { 
            padding: 80px 20px 40px; 
        }
        h1 { 
            font-size: 3rem; 
            margin-bottom: 15px; 
            color: #e94560; /* 포인트 컬러 (붉은 계열) */
            letter-spacing: 2px;
        }
        p { 
            font-size: 1.1rem; 
            color: #a9a9bc; 
            line-height: 1.6;
        }
        /* 콘텐츠 선택 영역 */
        .container { 
            display: flex; 
            justify-content: center; 
            gap: 30px; 
            margin-top: 40px; 
            flex-wrap: wrap; 
            padding: 20px;
        }
        .card { 
            background-color: #16213e; 
            padding: 50px 30px; 
            border-radius: 15px; 
            width: 300px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #2a2a4a;
        }
        .card:hover { 
            transform: translateY(-10px); 
            box-shadow: 0 15px 40px rgba(233, 69, 96, 0.2); 
            border-color: #e94560;
        }
        .card h2 { 
            color: #43bccd; /* 서브 포인트 컬러 (청록색) */
            margin-top: 0;
            font-size: 1.8rem;
        }
        footer {
            margin-top: 80px;
            padding: 20px;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>b37</h1>
        <p>당신의 무의식을 탐구하는 공간, 지하 37층에 오신 것을 환영합니다.<br>어떤 이야기를 나누고 싶으신가요?</p>
    </header>

    <div class="container">
        <!-- 타로 콘텐츠 이동 버튼 -->
        <div class="card" onclick="alert('타로 리딩 페이지로 이동합니다. (준비 중)')">
            <h2>인터랙티브 타로</h2>
            <p>오늘의 운세와 깊은 고민에 대한<br>해답을 카드를 통해 찾아보세요.</p>
        </div>
        
        <!-- 심리 분석 콘텐츠 이동 버튼 -->
        <div class="card" onclick="alert('심리 분석 페이지로 이동합니다. (준비 중)')">
            <h2>심리 분석 테스트</h2>
            <p>간단한 문답을 통해<br>숨겨진 내면의 자아를 알아봅니다.</p>
        </div>
    </div>

    <footer>
        &copy; 2026 Basement 37th Floor. All rights reserved.
    </footer>

</body>
</html>
